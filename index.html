<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NextStep ICT — University of Mpumalanga Portal">

  <title>NextStep ICT — University of Mpumalanga</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #1B365D;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #E8A800;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <h2 style="color: #E8A800; margin-bottom: 4px;">NextStep ICT Portal</h2>
    <p style="color: #cbd5e1; font-size: 14px;">Loading platform...</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
